name: Build Android AAB

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to bake into the build"
        required: false
        default: "https://ml.eijack.com/api"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}

      - name: Recreate release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Building unsigned AAB."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/ejack-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=ejack-release.keystore
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build AAB (release)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://ml.eijack.com/api' }}"

      - name: Build APK (release, universal)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL="${{ github.event.inputs.api_base_url || 'https://ml.eijack.com/api' }}"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejack-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ejack-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
