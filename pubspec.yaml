name: ejack
description: "Ejack platform mobile app - Driver, Customer & Manager"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Networking (Django REST)
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Persistence
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Routing
  go_router: ^14.6.1

  # Forms & validation
  flutter_form_builder: ^11.0.0
  form_builder_validators: ^11.0.0

  # UI helpers
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter

  # Utilities
  logger: ^2.4.0
  connectivity_plus: ^6.0.5

  # Location tracking (driver)
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Maps (OpenStreetMap — no API key required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Push notifications (local for now; FCM wiring documented separately)
  flutter_local_notifications: ^18.0.1

  # App metadata
  package_info_plus: ^8.1.1

  # Phone / launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  # fonts:
  #   - family: Cairo
  #     fonts:
  #       - asset: assets/fonts/Cairo-Regular.ttf
  #       - asset: assets/fonts/Cairo-Bold.ttf
  #         weight: 700
